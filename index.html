<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUTRIX | Institutional Data Sync & Analysis</title>
    <style>
        :root {
            --bg-white: #ffffff;
            --bg-light-purple: #f8f5ff;
            --purple-main: #6b21a8; 
            --purple-hover: #9333ea; 
            --text-dark: #1f2937;
            --text-muted: #4b5563;
            --border-light: #e5e7eb;
            --status-success: #16a34a;
            --status-error: #dc2626;
            --status-analysis: #2563eb;
        }

        body { background-color: var(--bg-light-purple); color: var(--text-dark); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #clock { position: absolute; top: 20px; right: 30px; color: var(--purple-main); font-family: monospace; font-size: 1.1rem; font-weight: bold; }
        .logo-img { width: 120px; height: auto; margin: 0 auto 20px auto; display: block; }
        .header-logo { width: 80px; height: auto; margin: 0 auto 10px auto; display: block; }
        #login-screen { position: fixed; inset: 0; background: var(--bg-light-purple); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-card { background: var(--bg-white); border: 1px solid var(--border-light); padding: 50px; text-align: center; border-radius: 16px; box-shadow: 0 10px 25px rgba(107, 33, 168, 0.1); max-width: 450px; width: 100%; }
        .rec-text { font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .nutrix-text { color: var(--purple-main); font-size: 3rem; font-weight: 900; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 25px; }
        input { background: var(--bg-white); border: 2px solid var(--border-light); color: var(--text-dark); padding: 15px; width: 85%; margin: 20px 0; text-align: center; font-size: 1.1rem; border-radius: 8px; outline: none; }
        #app { display: none; width: 100%; max-width: 1400px; padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; }
        .module { background: var(--bg-white); border: 1px solid var(--border-light); border-top: 5px solid var(--purple-main); padding: 25px; border-radius: 12px; }
        video, canvas { width: 100%; background: #e5e7eb; border-radius: 8px; border: 1px solid var(--border-light); aspect-ratio: 4/3; }
        .btn { background: var(--purple-main); border: none; color: white; padding: 16px; width: 100%; font-weight: bold; text-transform: uppercase; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        #analyzeBtn { background: var(--status-success); }
        #analysis-result { text-align: left; background: #fafafa; border: 1px solid var(--border-light); padding: 15px; min-height: 200px; overflow-y: auto; white-space: pre-wrap; font-size: 0.95rem; }
        #status-bar { width: 100%; background: var(--bg-white); color: var(--purple-main); padding: 15px; margin-top: 30px; font-family: monospace; font-weight: bold; border: 1px solid var(--purple-main); border-radius: 8px; }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div id="login-screen">
        <div class="login-card">
            <img src="REC Logo.png" alt="REC Logo" class="logo-img">
            <div class="rec-text">RAJALAKSHMI ENGINEERING COLLEGE</div>
            <div class="nutrix-text">NUTRIX</div>
            <input type="text" id="userInput" placeholder="NAME OF RESEARCHER..." autocomplete="off">
            <button class="btn" onclick="initialize()">ACCESS SYSTEM</button>
        </div>
    </div>

    <div id="app">
        <div class="app-header">
            <img src="REC Logo.png" alt="REC Logo" class="header-logo">
            <div class="rec-text">RAJALAKSHMI ENGINEERING COLLEGE</div>
            <div class="nutrix-text" style="font-size: 3.5rem;">NUTRIX</div>
        </div>
        
        <div class="grid">
            <div class="module">
                <h3>[ LIVE_FEED ]</h3>
                <video id="webcam" autoplay playsinline></video>
                <button class="btn" onclick="capture()">CAPTURE FRAME</button>
            </div>
            <div class="module">
                <h3>[ PROCESSED_FRAME ]</h3>
                <canvas id="snapshot"></canvas>
                <div id="controls" style="display:none;">
                    <button class="btn" id="analyzeBtn" onclick="analyzeFood()">ANALYZE CALORIES</button>
                    <button class="btn" onclick="sync()">SAVE TO DRIVE</button>
                </div>
            </div>
            <div class="module">
                <h3>[ NUTRITION_ANALYSIS ]</h3>
                <div id="analysis-result">Waiting for analysis...</div>
            </div>
        </div>
        <div id="status-bar">> SYSTEM READY.</div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2dIyCbF83XdRsXRDhKJJrRr6WM08dSNXJfw43bIhWTnvSX2GcKJBNojVH6WzmunTSyw/exec";
        const LOGMEAL_API_KEY = "baff6af49592b4678dba57c38826ebcef5e1cd2e"; 

        function initialize() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            navigator.mediaDevices.getUserMedia({ video: true }).then(s => document.getElementById('webcam').srcObject = s);
        }

        function capture() {
            const v = document.getElementById('webcam'), c = document.getElementById('snapshot');
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            document.getElementById('controls').style.display = 'block';
        }

        async function analyzeFood() {
            const canvas = document.getElementById('snapshot'), resultDiv = document.getElementById('analysis-result');
            const analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.disabled = true;
            resultDiv.innerText = "Processing...";

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('image', blob, 'food.jpg');

                try {
                    const response = await fetch('https://api.logmeal.com/v2/image/segmentation/complete', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${LOGMEAL_API_KEY}` },
                        body: formData
                    });

                    const data = await response.json();
                    if (!data.imageId) throw new Error("API rejection: No imageId returned.");

                    const nutResponse = await fetch('https://api.logmeal.com/v2/nutrition/recipe/nutritionalInfo', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${LOGMEAL_API_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imageId: data.imageId })
                    });

                    const nutData = await nutResponse.json();
                    resultDiv.innerText = `[ ANALYSIS ]\nCalories: ${nutData.nutritional_info.calories} kcal\nProtein: ${nutData.nutritional_info.macronutrients_proteins}g`;
                } catch (err) {
                    resultDiv.innerText = "Error: " + err.message;
                } finally {
                    analyzeBtn.disabled = false;
                }
            }, 'image/jpeg', 0.8);
        }

        function sync() {
            const name = document.getElementById('userInput').value;
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ image: document.getElementById('snapshot').toDataURL(), name: name })
            }).then(() => alert("Saved to Drive!"));
        }
    </script>
</body>
</html>
