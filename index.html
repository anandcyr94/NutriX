<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUTRIX | Institutional Data Sync</title>
    <style>
        :root {
            --bg-white: #ffffff;
            --bg-light-purple: #f8f5ff;
            --purple-main: #6b21a8; 
            --purple-hover: #9333ea; 
            --text-dark: #1f2937;
            --text-muted: #4b5563;
            --border-light: #e5e7eb;
            --status-success: #16a34a;
            --status-error: #dc2626;
        }

        body {
            background-color: var(--bg-light-purple);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #clock { 
            position: absolute; 
            top: 20px; 
            right: 30px; 
            color: var(--purple-main); 
            font-family: monospace; 
            font-size: 1.1rem; 
            font-weight: bold;
        }

        .logo-placeholder {
            width: 120px;
            height: 120px;
            background-color: #f3e8ff;
            border: 2px dashed var(--purple-main);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            color: var(--purple-main);
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
        }

        #login-screen {
            position: fixed; inset: 0; background: var(--bg-light-purple);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }

        .login-card {
            background: var(--bg-white); 
            border: 1px solid var(--border-light);
            padding: 50px; 
            text-align: center; 
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(107, 33, 168, 0.1);
            max-width: 450px;
            width: 100%;
        }

        .rec-text { font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .nutrix-text { color: var(--purple-main); font-size: 3rem; font-weight: 900; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 25px; }

        input {
            background: var(--bg-white); 
            border: 2px solid var(--border-light); 
            color: var(--text-dark);
            padding: 15px; 
            width: 85%; 
            margin: 20px 0; 
            text-align: center; 
            font-size: 1.1rem; 
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--purple-main);
            box-shadow: 0 0 0 3px rgba(107, 33, 168, 0.2);
        }

        #app { display: none; width: 100%; max-width: 1300px; padding: 30px; box-sizing: border-box; }

        .app-header { text-align: center; margin: 10px 0 30px 0; border-bottom: 2px solid #e9d5ff; padding-bottom: 20px; }

        .banner { 
            background: var(--purple-main); 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold; 
            text-transform: uppercase; 
            margin-bottom: 30px; 
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(107, 33, 168, 0.2); 
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 30px; }

        .module { 
            background: var(--bg-white); 
            border: 1px solid var(--border-light);
            border-top: 5px solid var(--purple-main); 
            padding: 25px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        video, canvas { 
            width: 100%; 
            background: #e5e7eb; 
            border-radius: 8px; 
            border: 1px solid var(--border-light); 
            object-fit: cover;
        }

        .btn {
            background: var(--purple-main); 
            border: none; 
            color: white;
            padding: 16px; 
            width: 100%; 
            font-weight: bold; 
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer; 
            margin-top: 15px; 
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn:hover:not(:disabled) { 
            background: var(--purple-hover); 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(147, 51, 234, 0.3);
        }
        .btn:disabled { background: #d1d5db; color: #9ca3af; cursor: not-allowed; transform: none; box-shadow: none; }

        #reBtn { background: var(--bg-white); border: 2px solid var(--status-error); color: var(--status-error); }
        #reBtn:hover:not(:disabled) { background: #fef2f2; }

        #status-bar { 
            width: 100%; 
            background: var(--bg-white); 
            color: var(--purple-main); 
            font-family: monospace; 
            padding: 15px; 
            margin-top: 30px; 
            font-size: 0.9rem; 
            border: 1px solid var(--purple-main); 
            border-radius: 8px;
            box-sizing: border-box;
            font-weight: bold;
        }

        footer { margin-top: auto; padding: 40px 0 20px 0; text-align: center; width: 100%; color: var(--text-muted); }
        .mentor { color: var(--purple-main); font-size: 1.2rem; font-weight: bold; }
        .team { font-weight: 600; font-size: 1rem; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <div id="login-screen">
        <div class="login-card">
            <div class="logo-placeholder">LOGO<br>PLACEHOLDER</div>
            <div class="rec-text">RAJALAKSHMI ENGINEERING COLLEGE</div>
            <div class="nutrix-text">NUTRIX</div>
            <h2 style="margin:0; font-size: 0.9rem; color: var(--text-muted); letter-spacing: 2px;">AUTHENTICATION REQUIRED</h2>
            <input type="text" id="userInput" placeholder="NAME OF RESEARCHER..." autocomplete="off">
            <br>
            <button class="btn" onclick="initialize()">ACCESS SYSTEM</button>
        </div>
    </div>

    <div id="app">
        <div class="app-header">
            <div class="logo-placeholder" style="width: 80px; height: 80px; font-size: 0.7rem; border-width: 1px;">LOGO</div>
            <div class="rec-text">RAJALAKSHMI ENGINEERING COLLEGE</div>
            <div class="nutrix-text" style="font-size: 3.5rem; margin-bottom: 0;">NUTRIX</div>
        </div>
        
        <div id="greeting" class="banner"></div>

        <div class="grid">
            <div class="module">
                <h3 style="color:var(--purple-main); margin:0 0 15px 0; font-size: 1rem; letter-spacing: 1px;">[ LIVE_FEED ]</h3>
                <video id="webcam" autoplay playsinline></video>
                <button class="btn" onclick="capture()">CAPTURE FRAME</button>
            </div>

            <div class="module">
                <h3 style="color:var(--text-muted); margin:0 0 15px 0; font-size: 1rem; letter-spacing: 1px;">[ PROCESSED_FRAME ]</h3>
                <canvas id="snapshot"></canvas>
                <div id="controls" style="display:none; gap:15px; margin-top:15px;">
                    <button class="btn" id="upBtn" onclick="sync()">SAVE TO DRIVE</button>
                    <button class="btn" id="reBtn" onclick="retake()">RETAKE</button>
                </div>
            </div>
        </div>

        <div id="status-bar">> SYSTEM READY. WAITING FOR DATA...</div>

        <footer>
            <div class="mentor">MENTOR: Mr. ANAND R</div>
            <div class="team">SANKARSHANAN R • SARUTHI R R • ABI PRIYADHARSHINI A</div>
        </footer>
    </div>

    <script>
        // -------------------------------------------------------------
        // IMPORTANT: REPLACE THIS URL AFTER YOU DEPLOY YOUR NEW SCRIPT
        // -------------------------------------------------------------
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2dIyCbF83XdRsXRDhKJJrRr6WM08dSNXJfw43bIhWTnvSX2GcKJBNojVH6WzmunTSyw/exec";

        function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }
        setInterval(updateClock, 1000);

        function setStatus(msg) { document.getElementById('status-bar').innerText = "> " + msg.toUpperCase(); }

        function initialize() {
            const name = document.getElementById('userInput').value;
            if(!name) return alert("System identification required.");
            
            document.getElementById('greeting').innerText = `HEY ${name.toUpperCase()}, WELCOME TO NUTRIX KNOW YOUR CALORIES`;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            setStatus("Session Started. Requesting camera access...");
            
            startCam();
        }

        async function startCam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('webcam').srcObject = stream;
                setStatus("Monitoring active.");
            } catch (err) {
                console.error("Camera error:", err);
                setStatus("SYSTEM ERROR: CAMERA ACCESS DENIED OR UNAVAILABLE.");
                document.getElementById('status-bar').style.color = "var(--status-error)";
                document.getElementById('status-bar').style.borderColor = "var(--status-error)";
                alert("Camera access is required. Please check your browser permissions or close other apps using the camera, then refresh the page.");
            }
        }

        function capture() {
            const v = document.getElementById('webcam');
            const c = document.getElementById('snapshot');
            c.width = v.videoWidth; 
            c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            
            document.getElementById('controls').style.display = 'flex';
            setStatus("Frame buffered. Waiting for cloud sync.");
        }

        function retake() {
            const c = document.getElementById('snapshot');
            c.getContext('2d').clearRect(0, 0, c.width, c.height);
            document.getElementById('controls').style.display = 'none';
            setStatus("Buffer cleared. Monitoring active.");
        }

        function sync() {
            const name = document.getElementById('userInput').value;
            const canvas = document.getElementById('snapshot');
            const data = canvas.toDataURL('image/png');
            const upBtn = document.getElementById('upBtn');
            const reBtn = document.getElementById('reBtn');

            upBtn.innerText = "UPLOADING..."; 
            upBtn.disabled = true; 
            reBtn.disabled = true;
            setStatus("Encrypting and uploading to Rajalakshmi Engineering College Drive...");

            fetch(SCRIPT_URL, {
                method: 'POST',
                redirect: 'follow', // Crucial for GAS web apps
                body: JSON.stringify({ 
                    image: data, 
                    name: name 
                })
            })
            .then(response => response.json())
            .then(result => {
                if (result.result === "success") {
                    setStatus("SYNC SUCCESSFUL. DATA STORED IN DRIVE FOLDER.");
                    alert("✅ DATA STORED: Frame saved successfully to REC Drive.");
                    upBtn.innerText = "SAVE TO DRIVE";
                    upBtn.disabled = false; 
                    reBtn.disabled = false;
                    retake();
                } else {
                    throw new Error(result.error || "Unknown backend error");
                }
            })
            .catch(err => {
                console.error(err);
                setStatus("SYNC ERROR: UPLOAD FAILED.");
                document.getElementById('status-bar').style.color = "var(--status-error)";
                document.getElementById('status-bar').style.borderColor = "var(--status-error)";
                alert("Upload failed. Ensure you deployed the script with 'Anyone' access and copied the new URL into the SCRIPT_URL variable.");
                upBtn.innerText = "SAVE TO DRIVE";
                upBtn.disabled = false; 
                reBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
